<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="css/global.css">

<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/css/intlTelInput.css">

<body>
    <!-- NAV BAR -->

    <div class="navbar">

        <div class="logo">
            <img src="images/logo.jpg" alt="logo">
            Jar of Oil Foundation
        </div>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="programs.html">Programs</a>
            <a href="Campaigns.html">Campaigns</a>

            <a href="contact.html">Contact</a>
            <a href="Donate.html" class="donateBtn">Donate</a>
        </div>

        <div class="hamburger" onclick="toggleMenu()">
            ☰
        </div>

    </div>

    <section class="contact-section">

        <h2 class="section-title">Contact Us ! </h2>

        <p class="contact-intro">
            We'd love to hear from you. Fill out the form below and we'll get back to you as soon as possible.
        </p>


        <form id="contactForm" class="contact-form">

            <div class="name-row">
                <div class="form-group">
                    <input type="text" name="entry.980593033" placeholder="Enter first name" required>

                </div>


                <div class="form-group">
                    <input type="text" name="entry.1031394214" placeholder="Enter middle name">
                </div>

                <div class="form-group">
                    <input type="text" name="entry.1042409929" placeholder="Enter last name" required>
                </div>
            </div>

            <div class="form-group">
                <input type="email" id="email" name="entry.1387571396" placeholder="example@email.com" required>

                <small id="emailError" class="error-message"></small>
            </div>

            <div class="form-group">
                <input type="tel" id="phone" name="entry.123456789" placeholder="Phone Number" required>

                <small id="phoneError" class="error-message"></small>
            </div>

            <div class="form-group">
                <input type="text" name="entry.1048504002" placeholder="e.g. Nairobi, Kiambu" required>
            </div>

            <div class="form-group">
                <label>How did you hear about us?</label>

                <select name="entry.1906410270" required>

                    <option value="">Select an option</option>

                    <option value="Facebook">Facebook</option>

                    <option value="Instagram">Instagram</option>

                    <option value="TikTok">TikTok</option>

                    <option value="Friend/Family">Friend/Family</option>

                    <option value="Website">Website</option>

                    <option value="Community Event">Community Event</option>

                    <option value="Other">Other</option>

                </select>
            </div>


            <div class="form-group">
                <label>Message</label>

                <textarea name="entry.371318084" rows="6" placeholder="Write your message here..." required></textarea>

            </div>

            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

        <div class="contact-info">

            <h3>Get in Touch</h3>

            <p>📧 jarofoilfoundation@gmail.com</p>

            <p>📞 +254 719 443 532</p>

            <div class="social-icons">

                <a href="https://www.facebook.com/jarofoil.foundation/"><img src="images/facebook logo.jpg"
                        alt="Facebook"></a>

                <a href="https://www.instagram.com/jar.of.oil/"><img src="images/instagram logo.jpg"
                        alt="Instagram"></a>

                <a href="https://www.tiktok.com/@jar.of.oil"><img src="images/tiktok.logo.png" alt="TikTok"></a>

            </div>

        </div>

    </section>



    <footer>

        <p>
            © Jar of Oil Foundation | All Rights Reserved
        </p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/intlTelInput.min.js"></script>

    <script>
        const phoneInput = document.querySelector("#phone");

        const iti = window.intlTelInput(phoneInput, {
            initialCountry: "ke",
            separateDialCode: true,
            loadUtils: () =>
                import("https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/utils.js")
        });
    </script>


    <script src="js/contact.js"></script>
    <script src="js/main.js"></script>


</body>

</html>
